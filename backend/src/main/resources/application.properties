spring.application.name=bankease-backend
server.port=8081

# ===================================================================
# Local Environment File Support (ignored by Git)
# ===================================================================
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ===================================================================
# MySQL Database Connection Configuration
# ===================================================================
# JDBC URL for localhost on port 3306 pointing to 'bankease' database
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/bankease?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}

# Database credentials read from environment variables or local .env
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

# MySQL JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# Spring Data JPA / Hibernate Configuration
# ===================================================================
# Automatically updates database tables to match entity models
spring.jpa.hibernate.ddl-auto=update

# Show formatted SQL queries in the console log
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Best practice for REST APIs: closes database session after service layer
spring.jpa.open-in-view=false

# ===================================================================
# JWT (JSON Web Token) Configuration
# ===================================================================
# 256-bit secure secret key for HMAC-SHA256 signing (configured via environment or .env)
jwt.secret=${JWT_SECRET:}
# Expiration: 24 hours in milliseconds (86400000 ms)
jwt.expiration=86400000
